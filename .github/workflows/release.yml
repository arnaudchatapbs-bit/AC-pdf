# Compile l'APK Android signé, puis le publie dans une Release GitHub.
#
# Déclenchement : pousser un tag de version, par exemple
#   git tag v1.3.0 && git push origin v1.3.0
# ou lancer le workflow à la main depuis l'onglet « Actions » :
#   - avec une version (ex. 1.3.0) : crée le tag v1.3.0 et publie la release ;
#   - sans version : fichiers disponibles seulement en artefacts.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   ANDROID_KEYSTORE_BASE64   contenu de la clé de signature encodé en base64
#   ANDROID_KEYSTORE_PASSWORD mot de passe de la clé
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. 1.3.0). Vide = compilation de test sans release.'
        required: false
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : l'APK ne pourrait pas être mis à jour par-dessus l'ancien."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Numéro de version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "BUILD_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [ -n "$INPUT_VERSION" ]; then
            echo "BUILD_NAME=${INPUT_VERSION#v}" >> "$GITHUB_ENV"
          else
            echo "BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"
          fi
          # Numéro interne croissant déduit de la version (1.3.0 -> 10300) :
          # Android refuse une mise à jour dont le numéro est plus petit.
          source "$GITHUB_ENV"
          IFS=. read -r MAJ MIN PAT <<< "$BUILD_NAME"
          echo "BUILD_NUMBER=$(( ${MAJ:-0} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Compilation
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: pdffacile
        run: |
          flutter build apk --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk "ACpdf-$BUILD_NAME.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: ACpdf-*.apk

  release:
    needs: [android]
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - name: Tag de la release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TAG=v${INPUT_VERSION#v}" >> "$GITHUB_ENV"
          fi

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publication de la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            ## Installer sur Android
            1. Sur le téléphone, touchez le fichier **ACpdf-….apk** ci-dessous pour le télécharger.
            2. Ouvrez le fichier téléchargé ; si Android le demande, autorisez « Installer des applications inconnues » pour le navigateur.
            3. Les versions suivantes s'installent par-dessus, sans perdre vos documents.
