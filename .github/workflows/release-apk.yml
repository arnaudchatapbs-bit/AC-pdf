# Compile l'APK Android signé et le publie dans une Release GitHub.
#
# Déclenchement : pousser un tag de version, par exemple
#   git tag v1.0.0 && git push origin v1.0.0
# ou lancer le workflow à la main depuis l'onglet « Actions » (APK disponible en artefact).
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   ANDROID_KEYSTORE_BASE64   contenu de la clé de signature encodé en base64
#   ANDROID_KEYSTORE_PASSWORD mot de passe de la clé
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : l'APK ne pourrait pas être mis à jour par-dessus l'ancien."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Numéro de version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "BUILD_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"
          fi

      - run: flutter pub get

      - name: Compilation
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: pdffacile
        run: |
          flutter build apk --release --build-name "$BUILD_NAME" --build-number "${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk "PDF-Facile-$BUILD_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Facile-${{ env.BUILD_NAME }}
          path: PDF-Facile-*.apk

      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PDF-Facile-*.apk
          body: |
            ## Installer sur Android
            1. Sur le téléphone, touchez **PDF-Facile-${{ env.BUILD_NAME }}.apk** ci-dessous pour le télécharger.
            2. Ouvrez le fichier téléchargé ; si Android le demande, autorisez « Installer des applications inconnues » pour le navigateur.
            3. Les versions suivantes s'installent par-dessus, sans perdre vos documents.
